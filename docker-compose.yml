version: "3.8"

services:
  mysql:
    image: mysql:8.4
    container_name: ticketmesh-mysql
    environment:
      MYSQL_DATABASE: ticketmesh_db
      MYSQL_USER: ticketmesh_app
      MYSQL_PASSWORD: ticketmesh_password
      MYSQL_ROOT_PASSWORD: root_password
    ports:
      - "3306:3306"
    volumes:
      - ticketmesh_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ticketmesh-app
    environment:
      DB_URL: "jdbc:mysql://mysql:3306/ticketmesh_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true"
      DB_USERNAME: ticketmesh_app
      DB_PASSWORD: ticketmesh_password
      JWT_SECRET: "local-dev-secret-change-me"
      QR_SECRET: "local-dev-qr-secret-change-me"
      BOOTSTRAP_ADMIN_USERNAME: admin
      BOOTSTRAP_ADMIN_PASSWORD: ChangeMe123!
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  ticketmesh_mysql_data:
