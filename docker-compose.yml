# TicketMesh fully-working local stack: MySQL (persistent datastore) + backend
# (Spring Boot) + frontend (nginx serving the built SPA, proxying /api).
#
# Build: mvn -DskipTests package && npm --prefix frontend run build
# Run:   docker compose up --build -d
# Web:  http://localhost       (SPA, served by nginx)
# API:  http://localhost:8080  (backend)
# Login: admin / ChangeMe123!
services:
  mysql:
    image: mysql:8.4
    container_name: ticketmesh-mysql
    environment:
      MYSQL_DATABASE: ticketmesh_db
      MYSQL_USER: ticketmesh_app
      MYSQL_PASSWORD: ticketmesh_password
      MYSQL_ROOT_PASSWORD: root_password
    ports:
      - "3306:3306"
    volumes:
      - ticketmesh_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot_password"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  app:
    build:
      # Repo root context so the image always picks up the freshly built jar
      # from target/ (previously the jar was copied into docker/app by hand,
      # which silently shipped stale code).
      context: .
      dockerfile: docker/app/Dockerfile
    container_name: ticketmesh-app
    environment:
      DB_URL: "jdbc:mysql://mysql:3306/ticketmesh_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true"
      DB_USERNAME: ticketmesh_app
      DB_PASSWORD: ticketmesh_password
      JWT_SECRET: "local-dev-secret-change-me-please-2026"
      QR_SECRET: "local-dev-qr-secret-change-me-2026"
      PII_MASTER_KEY: "local-dev-pii-master-key-2026!!"
      BOOTSTRAP_ADMIN_USERNAME: admin
      BOOTSTRAP_ADMIN_PASSWORD: ChangeMe123!
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
    container_name: ticketmesh-frontend
    ports:
      - "80:80"
    depends_on:
      - app
    restart: unless-stopped

  phpmyadmin:
    image: phpmyadmin:5.2
    container_name: ticketmesh-phpmyadmin
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      PMA_ARBITRARY: "1"
      UPLOAD_LIMIT: "128M"
    ports:
      - "8081:80"
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped

volumes:
  ticketmesh_mysql_data:
