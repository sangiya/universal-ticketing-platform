apiVersion: apps/v1
kind: Deployment
metadata:
  name: ticketmesh-core
  labels:
    app: ticketmesh-core
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ticketmesh-core
  template:
    metadata:
      labels:
        app: ticketmesh-core
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: ticketmesh-core
          image: sangiya/ticketmesh-core:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: ticketmesh-config
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ticketmesh-secrets
                  key: db-password
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: ticketmesh-secrets
                  key: jwt-secret
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health/live
              port: http
            initialDelaySeconds: 30
            periodSeconds: 15
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: ticketmesh-core
spec:
  type: ClusterIP
  selector:
    app: ticketmesh-core
  ports:
    - name: http
      port: 80
      targetPort: 8080
