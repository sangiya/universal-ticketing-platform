apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: ticketmesh-core
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: ticketmesh-core
  minReplicas: 2
  maxReplicas: 20
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 30
      policies:
        - type: Pods
          value: 4
          periodSeconds: 20
    scaleDown:
      stabilizationWindowSeconds: 120
      policies:
        - type: Pods
          value: 2
          periodSeconds: 60
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 75
