spring:
  profiles:
    default: ai-offline
  datasource:
    url: jdbc:h2:mem:ticketmesh_test;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration

app:
  jwt:
    secret: test-only-secret-key-that-is-long-enough-hs256-2026
    expiration-ms: 3600000
  qr:
    secret: test-only-qr-signing-secret-2026
  reservation:
    pending-timeout-ms: 3600000
    hold-timeout-ms: 3600000
    scheduler-interval-ms: 60000

logging:
  level:
    org.springframework.security: WARN
